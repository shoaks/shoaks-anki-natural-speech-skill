tts:
  provider: auto
  audio_required: true
  example_audio_required: true
  prefer_local: true
  allow_network: false
  allow_paid_api: false
  discovery:
    enabled: true
    auto_install: false
    auto_download_large_models: false
  fallback:
    enabled: true
    providers: []
    max_provider_attempts: 3
    max_retries_same_provider: 0

cards:
  default_type: listening
  front_audio_only: true
  show_target_on_front: false
  show_meaning_on_front: false
  show_image_on_front: false
  examples_exact: 2
  tappable_contextual_glosses: true
  no_external_dictionary_by_default: true
  javascript_progressive_enhancement: true

content:
  explanations_language: en
  preserve_original_input: true
  examples_exact: 2
  reject_trivial_near_duplicates: true
  require_natural_example_meaning: true
  require_gloss_for_every_lexical_token: true
  prefer_chunk_glosses: true

export:
  format: apkg
  media_audio_format: wav
  embed_required_audio_in_apkg: true

validation:
  require_target_audio: true
  require_example_audio: true
  required_audio_count_per_standard_note: 3
  require_sound_reference: true
  require_apkg_media_entry: true
  require_all_sound_references_resolved: true
  require_front_audio_only: true
  require_exact_examples: 2
  require_example_meaning: true
  require_lexical_gloss_coverage: true
  fail_on_missing_audio: true
  fail_on_template_contract_violation: true

execution:
  preflight_required: true
  cache_required: true
  stop_before_expensive_work: true
  stop_on_same_deterministic_error: true
  max_retries_per_step: 1
  smoke_test:
    enabled: true
    note_count: 1
    require_exact_examples: 2
    require_target_audio: true
    require_all_example_audio: true
    require_gloss_coverage: true
    require_apkg_export: true
    require_apkg_media_check: true
    stop_batch_on_failure: true
  batch:
    start_only_after_smoke_pass: true
