tts:
  provider: auto
  audio_required: true
  example_audio_required: true
  embed_required_audio_in_apkg: true
  default_audio: natural
  generate_careful_audio: auto
  prefer_local: true
  allow_network: false
  allow_paid_api: false
  discovery:
    enabled: true
    auto_install: false
    auto_download_large_models: false
  fallback:
    enabled: true
    providers: []
    max_provider_attempts: 3
    max_retries_same_provider: 0

image:
  mode: semantic_optional

cost_policy:
  prefer_free: true
  allow_paid_api: false
  allow_network: false

export:
  format: apkg
  media_audio_format: wav
  media_image_format: webp

validation:
  require_audio_file: true
  require_example_audio_file: true
  require_audio_provider: true
  fail_on_missing_audio: true
  require_examples_for_standard_items: true
  min_examples_for_standard_items: 4
  require_complete_example_sentence: true
  require_sound_reference: true
  require_apkg_media_entry: true
  require_all_example_audio_in_apkg: true
  fail_on_unresolved_sound_reference: true
  fail_on_empty_media_for_pronounceable_notes: true

cards:
  listening: true
  comprehension: false
  production: selective
  error_correction: selective
  cloze: false
  default_front:
    show_audio: true
    show_image: optional
    show_target: false
    show_meaning: false

examples:
  required_for:
    - word
    - phrase
    - sentence
  min_examples: 4
  require_complete_sentence: true
  require_audio_per_example: true
  require_distinct_audio_file_per_example: true
  require_apkg_embedding: true
  prefer_collocation_or_construction: true
  reject_trivial_near_duplicates: true

execution:
  preflight_required: true
  cache_required: true
  stop_before_expensive_work: true
  stop_on_same_deterministic_error: true
  max_retries_per_step: 1
  smoke_test:
    enabled: true
    note_count: 1
    require_min_examples: 4
    require_target_audio: true
    require_all_example_audio: true
    require_apkg_export: true
    require_apkg_media_check: true
    require_all_sound_references_resolved: true
    stop_batch_on_failure: true
  batch:
    start_only_after_smoke_pass: true
