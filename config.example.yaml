tts:
  provider: auto
  audio_required: true
  default_audio: natural
  generate_careful_audio: auto
  prefer_local: true
  allow_network: false
  allow_paid_api: false
  discovery:
    enabled: true
    auto_install: false
    auto_download_large_models: false
  fallback:
    enabled: true
    providers: []
    max_provider_attempts: 3
    max_retries_same_provider: 0

image:
  mode: local_preferred

cost_policy:
  prefer_free: true
  allow_paid_api: false

export:
  format: apkg
  media_audio_format: wav
  media_image_format: webp

validation:
  require_audio_file: true
  require_audio_provider: true
  fail_on_missing_audio: true
  require_single_word_example: true
  require_sound_reference: true
  require_apkg_media_entry: true
  fail_on_empty_media_for_pronounceable_notes: true

cards:
  comprehension: true
  listening: auto
  production: selective
  error_correction: selective
  cloze: false

single_word:
  example_required: true
  min_examples: 1
  prefer_collocation: true
  require_complete_sentence: true

execution:
  preflight_required: true
  cache_required: true
  stop_on_same_deterministic_error: true
  max_retries_per_step: 1
  smoke_test:
    enabled: true
    note_count: 1
    require_audio: true
    require_apkg_export: true
    require_apkg_media_check: true
    stop_batch_on_failure: true
  batch:
    start_only_after_smoke_pass: true
